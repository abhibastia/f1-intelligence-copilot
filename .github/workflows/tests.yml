name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    # Pinned rather than ubuntu-latest: the floating label began migrating to
    # Ubuntu 26 on 2026-10-19, and a runner image that changes under you turns
    # an unrelated push into a debugging session. Needs a deliberate bump when
    # 24.04 nears end of support - a stale pin is the cost of a stable one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: ruff check .
      - run: ruff format --check .

      # No Databricks credentials exist here, by design - this is a public
      # runner. Nothing special needs to happen for that: every test that
      # needs Lakebase is `integration`-marked and skips cleanly through the
      # `lakebase` fixture in tests/conftest.py the same way it does on a
      # laptop with no .databrickscfg, so a plain `pytest` run is exactly
      # what a contributor already runs before pushing (see CLAUDE.md's
      # Verification bar) - this just makes sure nobody forgets to.
      - run: pytest

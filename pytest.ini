[pytest]
testpaths = tests
markers =
    integration: needs a live Lakebase connection (skips cleanly without one)
# tests/spark/ needs a Spark session and runs on Databricks as the first task
# of the f1_end_to_end job, not here. Collecting it locally would fail on the
# pyspark import and make `pytest` look broken on a clean checkout.
addopts = -q --ignore=tests/spark

# Every job is SERVERLESS. Free Edition has no classic compute, so a
# `job_clusters` block with a node_type_id cannot deploy at all - omitting every
# compute key is what makes these run.
#
# Schedules ship PAUSED. Deploying this bundle must not start consuming a daily
# quota that cannot be recovered until the next day.

# VERIFICATION STATUS — stated because a deployed job definition is not
# evidence that it ran.
#
#   HOW TO RUN THE CDF JOB (read this before using the bundle definition):
#     The notebook succeeds when submitted directly and fails reproducibly when
#     launched from this bundle - three attempts, same notebook, same
#     parameters, same serverless config, dying with "Fatal Python error:
#     Aborted". The difference appears to be the bundle files directory it runs
#     from, not the code. Until that is understood, the verified command is:
#
#       databricks workspace import /Workspace/Users/<you>/f1-intelligence-copilot/cdf_agent_analytics \
#         --file notebooks/cdf_agent_analytics.py --language PYTHON --format SOURCE --overwrite
#       databricks jobs submit --json @cdf_job.json
#
#     The bundle definition is kept because it is the right shape and is what a
#     reviewer should read; it is not what produced the analytics table.
#
#   VERIFIED on Databricks:
#     f1_ingest_incremental   (in pipeline/) — calls Jolpica, lands the Volume
#     f1_medallion_pipeline   (in pipeline/) — Bronze -> Silver -> Gold
#     f1_cdf_analytics        — Change Data Feed -> Delta analytics table
#     embedding on serverless — probed separately; loads and encodes fine
#
#   DEPLOYS BUT NOT VERIFIED END TO END on Free Edition:
#     harvest    — ~176 sequential HTTP calls; the kernel is killed as
#                  unresponsive. Databricks' shared egress IP is throttled by
#                  Wikipedia far harder than a laptop is, so the courtesy delays
#                  stretch past the kernel's patience. Runs fine locally.
#     seed_gold  — collecting a MATERIALIZED VIEW to the driver appears to force
#                  a recompute of the mart rather than a cheap read; the kernel
#                  dies. Neither switching task type nor splitting dependencies
#                  changed it. The local seeder does the same work in two
#                  warehouse queries and is what produced the current data.
#
# Both are kept because they are the right shape and are reviewable, and because
# the limitation is a Free Edition one rather than a defect in the code. Neither
# is on the critical path: the data they produce is already loaded.

resources:
  jobs:

    # ---------------------------------------------------------------- refresh
    # One job, four ordered tasks. The order is not cosmetic: harvest lands race
    # reports and weather, embed turns the new documents into vectors, seeding
    # copies the Gold marts the pipeline produced, and the CDF task materialises
    # whatever agent activity has accumulated.
    f1_full_refresh:
      name: f1_full_refresh
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      # Two environments, not one. The first attempt put sentence-transformers
      # in a single shared environment, so every task installed ~2 GB of torch -
      # including harvest and seed_gold, which never import it. Both crashed
      # with "The Python process exited unexpectedly", the serverless
      # out-of-memory signature. Only the embedding task needs the heavy stack.
      environments:
        - environment_key: light
          spec:
            client: "3"
            dependencies:
              - requests>=2.31.0
              - psycopg2-binary>=2.9.9
              - databricks-sdk>=0.30.0

        - environment_key: embedding
          spec:
            client: "3"
            dependencies:
              - psycopg2-binary>=2.9.9
              - databricks-sdk>=0.30.0
              - sentence-transformers>=3.0.0

      tasks:
        - task_key: harvest
          spark_python_task:
            python_file: ../jobs/run_harvest.py
          environment_key: light

        - task_key: embed
          depends_on: [{ task_key: harvest }]
          spark_python_task:
            python_file: ../jobs/run_embed.py
          environment_key: embedding

        - task_key: seed_gold
          notebook_task:
            notebook_path: ../notebooks/seed_gold_to_lakebase.py
            base_parameters:
              lakebase_secret_scope: ${var.lakebase_scope}
              lakebase_secret_key: ${var.lakebase_key}

        - task_key: cdf_analytics
          depends_on: [{ task_key: seed_gold }]
          notebook_task:
            notebook_path: ../notebooks/cdf_agent_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: gold
              lakebase_secret_scope: ${var.lakebase_scope}
              lakebase_secret_key: ${var.lakebase_key}

      schedule:
        quartz_cron_expression: "0 0 5 ? * TUE"
        timezone_id: UTC
        pause_status: PAUSED

    # ------------------------------------------------- agent analytics only
    # Split out because it is the one worth running often: it is cheap, and it
    # is what keeps the app's agent-activity view current between refreshes.
    f1_cdf_analytics:
      name: f1_cdf_analytics
      max_concurrent_runs: 1
      tasks:
        - task_key: cdf_analytics
          notebook_task:
            notebook_path: ../notebooks/cdf_agent_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: gold
              lakebase_secret_scope: ${var.lakebase_scope}
              lakebase_secret_key: ${var.lakebase_key}
      schedule:
        quartz_cron_expression: "0 0 */6 ? * *"
        timezone_id: UTC
        pause_status: PAUSED

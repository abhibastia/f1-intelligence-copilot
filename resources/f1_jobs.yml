# Every job is SERVERLESS. Free Edition has no classic compute, so a
# `job_clusters` block with a node_type_id cannot deploy at all - omitting every
# compute key is what makes these run.
#
# Schedules ship PAUSED. Deploying this bundle must not start consuming a daily
# quota that cannot be recovered until the next day.

# VERIFICATION STATUS — stated because a deployed job definition is not
# evidence that it ran.
#
#   VERIFIED on Databricks, end to end, by deploying this bundle and running
#   f1_full_refresh for real against a live workspace:
#     f1_ingest_incremental   (in resources/) — calls Jolpica, lands the Volume
#     f1_medallion_pipeline   (in resources/) — Bronze -> Silver -> Gold
#     harvest                 — fetched a real newly-added race (2026 Dutch GP)
#                                and wrote it to Lakebase immediately
#     embed                   — loaded sentence-transformers and embedded the
#                                new chunks
#     seed_gold               — seeded weather, pit stops, all six Gold marts
#                                and derived stints via the SQL Statement
#                                Execution API, with no --profile (ambient
#                                job-runtime auth)
#
#   `harvest` and `seed_gold` both used to fail as spark_python_task jobs with
#   the generic "The Python process exited unexpectedly". The actual cause,
#   found by running the job for real and reading the driver logs instead of
#   guessing from that message: `import psycopg2` SIGABRTs immediately inside
#   f1lake/schema.py, before either task's own code runs at all.
#   psycopg2-binary bundles a compiled OpenSSL/libpq, and this serverless
#   kernel already has other native extensions (pandas, pyarrow, grpc) loaded
#   in the same process before a spark_python_task's own imports even start -
#   a documented crash class for psycopg2-binary, worse on ARM64. (Two earlier
#   guesses lived in this comment block - a materialized-view recompute for
#   seed_gold, an unresponsive-kernel timeout for harvest. Both were plausible
#   from the vague error alone and both were wrong: the two tasks failed at
#   the identical import line regardless of what they otherwise did.)
#
#   Fix: f1lake/schema.py now uses pg8000, a pure-Python driver with no
#   compiled extension, so no native ABI collision is possible. `harvest` also
#   keeps a retry policy and a generous timeout regardless, since each race is
#   written to Lakebase immediately after it's fetched
#   (harvest.wikipedia.fetch_and_store) rather than batched to the end - a
#   genuinely slow or throttled run still makes forward progress a retry can
#   pick up, independent of the crash above. `seed_gold` also now seeds pit
#   stops from the governed f1.silver.fact_pit_stop table instead of
#   harvest/laps.py fetching them a second time from Jolpica, and derives
#   stints afterward - pure Lakebase computation, no network at all.
#
#   `cdf_analytics` had the SAME psycopg2 crash, one file over. It had been
#   read as a different, unsolved problem ("fails via bundle-run, works via
#   jobs submit, difference appears to be the working directory") because it
#   was never actually diagnosed - just observed to fail differently under two
#   trigger paths and left there. The driver logs say otherwise: identical
#   SIGABRT, identical `import psycopg2` frame, inside
#   notebooks/cdf_agent_analytics.py this time. Fixed the same way - pg8000
#   instead of psycopg2-binary.
#
#   Clearing that exposed a second, unrelated issue: the notebook hardcoded
#   `startingVersion=1` for the Change Data Feed read, which fails once
#   version 1's files age past `delta.deletedFileRetentionDuration` (168
#   hours) - a VACUUM boundary, not a CDF one, and exactly the risk ADR-0008
#   flagged when this table was first designed. There is no recovering the
#   changes in an expired window; the fix falls back to the table's current
#   version as a fresh incremental starting point rather than failing the run.
#
#   All four tasks - harvest, embed, seed_gold, cdf_analytics - now succeed
#   together in one f1_full_refresh run, verified live, via
#   `databricks bundle run f1_full_refresh`. No `jobs submit` workaround is
#   needed any more.

resources:
  jobs:

    # ---------------------------------------------------------------- refresh
    # Two independent chains, one job. harvest -> embed turns Wikipedia
    # articles into vectors; seed_gold runs in parallel, copying the Gold/
    # Silver marts (weather, pit stops, six marts, derived stints) the
    # medallion pipeline already produced - nothing in that chain depends on
    # the other. cdf_analytics waits on seed_gold, because it reads a Gold
    # table seed_gold's schema.ensure_schema() call also touches.
    f1_full_refresh:
      name: f1_full_refresh
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      # Two environments, not one. The first attempt put sentence-transformers
      # in a single shared environment, so every task installed ~2 GB of torch -
      # including harvest and seed_gold, which never import it. Both crashed
      # with "The Python process exited unexpectedly", the serverless
      # out-of-memory signature. Only the embedding task needs the heavy stack.
      environments:
        - environment_key: light
          spec:
            client: "3"
            dependencies:
              - requests>=2.31.0
              # Pure-Python driver, not psycopg2-binary: the latter's bundled
              # OpenSSL/libpq SIGABRTs on this serverless runtime when other
              # native extensions (pandas, pyarrow, grpc) are already loaded
              # in the process - see f1lake/schema.py.
              - pg8000>=1.31
              - databricks-sdk>=0.30.0

        - environment_key: embedding
          spec:
            client: "3"
            dependencies:
              - pg8000>=1.31
              - databricks-sdk>=0.30.0
              - sentence-transformers>=3.0.0

      tasks:
        - task_key: harvest
          spark_python_task:
            python_file: ../jobs/run_harvest.py
          environment_key: light
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 2700

        - task_key: embed
          depends_on: [{ task_key: harvest }]
          spark_python_task:
            python_file: ../jobs/run_embed.py
          environment_key: embedding
          timeout_seconds: 1800

        # No depends_on: seed_gold reads Gold/Silver marts and writes weather,
        # pit stops and stints, none of which touch the Wikipedia documents
        # harvest/embed produce - it runs in parallel with that chain, not
        # after it, the same way the original design intended.
        - task_key: seed_gold
          spark_python_task:
            python_file: ../jobs/run_seed_gold.py
            parameters:
              - "--warehouse-id"
              - "${var.warehouse_id}"
          environment_key: light
          timeout_seconds: 1800

        - task_key: cdf_analytics
          depends_on: [{ task_key: seed_gold }]
          notebook_task:
            notebook_path: ../notebooks/cdf_agent_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: gold
              lakebase_secret_scope: ${var.lakebase_scope}
              lakebase_secret_key: ${var.lakebase_key}

      schedule:
        quartz_cron_expression: "0 0 5 ? * TUE"
        timezone_id: UTC
        pause_status: PAUSED

    # ------------------------------------------------- agent analytics only
    # Split out because it is the one worth running often: it is cheap, and it
    # is what keeps the app's agent-activity view current between refreshes.
    f1_cdf_analytics:
      name: f1_cdf_analytics
      max_concurrent_runs: 1
      tasks:
        - task_key: cdf_analytics
          notebook_task:
            notebook_path: ../notebooks/cdf_agent_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: gold
              lakebase_secret_scope: ${var.lakebase_scope}
              lakebase_secret_key: ${var.lakebase_key}
      schedule:
        quartz_cron_expression: "0 0 */6 ? * *"
        timezone_id: UTC
        pause_status: PAUSED
